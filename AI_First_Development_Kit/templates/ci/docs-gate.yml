# Copy to .github/workflows/docs-gate.yml (principles/documentation-phases.md).
# `edited` re-runs the gate when the PR description changes, so adding
# "Changelog: N/A (<reason>)" to the Documentation block takes effect without a push.
name: docs-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Documentation gate
        env:
          # The script finds "Changelog: N/A" in the body, bold or not (check-docs.sh).
          DOCS_PR_BODY: ${{ github.event.pull_request.body }}
        run: bash AI_First_Development_Kit/scripts/check-docs.sh all origin/${{ github.base_ref }}
