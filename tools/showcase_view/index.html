<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breach showcase</title>
<link rel="stylesheet" href="showcase_view.css">
<base target="_top">
</head>
<body>
<header>
  <h1>Breach showcase</h1>
  <p>Every PR that changes the game, played on the 2D field: each named scenario's clip, four
  stills and that commit's tick timings, newest first
  (<a href="https://github.com/Ludus-Montis/Breach/blob/main/specs/44-project-site-and-showcase.md">spec 44</a>).</p>
  <form id="filters" class="filters">
    <label><input type="checkbox" name="state" value="open" checked> Open</label>
    <label><input type="checkbox" name="state" value="merged" checked> Merged</label>
    <label><input type="checkbox" name="state" value="closed" checked> Closed unmerged</label>
    <label>Scenario <select id="scenario"><option value="">All</option></select></label>
  </form>
  <p id="status">Loading manifest.json…</p>
</header>
<main id="cards"></main>
<script src="showcase_view.js"></script>
<script src="showcase_page.js"></script>
</body>
</html>
