default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: gdformat-check
        name: gdformat (GDScript formatting)
        entry: gdformat --check --diff
        language: python
        additional_dependencies: ["gdtoolkit==4.*"]
        files: \.gd$
        exclude: ^addons/

      - id: gdlint
        name: gdlint (GDScript linting - lint-clean)
        entry: gdlint
        language: python
        additional_dependencies: ["gdtoolkit==4.*"]
        files: \.gd$
        exclude: ^addons/

      - id: check-function-length
        name: srp-size (function length)
        entry: python3 ci/godot/scripts/check_function_length.py
        language: system
        pass_filenames: false
        files: \.gd$
        exclude: ^addons/

      - id: check-dependency-direction
        name: dip-direction (sim/ must not depend on presentation/ or engine Node types)
        entry: python3 ci/godot/scripts/check_dependency_direction.py
        language: system
        pass_filenames: false
        files: \.gd$
        exclude: ^addons/

      - id: check-generic-naming
        name: naming-grep-discoverable
        entry: python3 ci/godot/scripts/check_generic_naming.py
        language: system
        pass_filenames: false
        files: \.gd$
        exclude: ^addons/

      - id: check-id-order
        name: order-independent-simulation (ids name, never rank)
        entry: python3 ci/godot/scripts/check_id_order.py
        language: system
        pass_filenames: true
        files: ^sim/.*\.gd$

      - id: check-one-mover
        name: one-mover (units move through UnitMover, Decision 139)
        entry: python3 ci/godot/scripts/check_one_mover.py
        language: system
        pass_filenames: true
        files: ^sim/.*\.gd$

      - id: check-one-health
        name: one-health (hp changes through UnitHealth, Decision 145)
        entry: python3 ci/godot/scripts/check_one_health.py
        language: system
        pass_filenames: true
        files: ^sim/.*\.gd$

      - id: check-one-state
        name: one-state (a unit's state changes through UnitState, Decision 147)
        entry: python3 ci/godot/scripts/check_one_state.py
        language: system
        pass_filenames: true
        files: ^(sim|tools|presentation|tests)/.*\.gd$

      - id: check-store-reads
        name: store-reads-once (no store read unit by unit in a loop, Decision 144)
        entry: python3 ci/godot/scripts/check_store_reads.py
        language: system
        pass_filenames: true
        files: ^sim/.*\.gd$

      - id: check-isp
        name: isp-method-count / isp-stub-detection
        entry: python3 ci/godot/scripts/check_isp.py
        language: system
        pass_filenames: false
        files: \.gd$
        exclude: ^addons/

      - id: check-decisions-index
        name: decisions-index (DECISIONS_INDEX.md matches the Decision ledger)
        entry: python3 tools/decisions_index.py --check
        language: system
        pass_filenames: false
        files: ^(Breach — Reverse Tower Defense Design Spec\.md|DECISIONS_INDEX\.md|tools/decisions_index\.py)$

      - id: check-open-questions
        name: open-questions (no entry under Open; they are issues, Decision 148)
        entry: python3 ci/github/check_open_questions.py
        language: system
        pass_filenames: false
        files: ^(OPEN_QUESTIONS\.md|ci/github/check_open_questions\.py)$

      - id: check-helper-promotion
        name: no-cross-cutting-helper-violation
        entry: python3 ci/godot/scripts/check_helper_promotion.py
        language: system
        pass_filenames: false
        files: \.gd$
        exclude: ^addons/

      - id: check-ocp-shotgun-surgery
        name: ocp-shotgun-surgery (needs a committed base ref; no-ops otherwise)
        entry: python3 ci/godot/scripts/check_ocp_shotgun_surgery.py
        language: system
        pass_filenames: false
        files: \.gd$
        exclude: ^addons/

      - id: check-context-locality
        name: context-locality (informational; needs a committed base ref)
        entry: python3 ci/godot/scripts/check_context_locality.py
        language: system
        pass_filenames: false
        files: \.gd$
        exclude: ^addons/

      - id: tools-tests
        name: tools-tests (the designer's and the trace view's JS with node --test, if Node is installed; tools/, ci/godot/scripts and ci/github with stdlib unittest)
        entry: bash -c '{ ! command -v node >/dev/null || node --test "tools/designer/test/*.test.js" "tools/trace_view/test/*.test.js"; } && python3 -m unittest discover -s tools -p "test_*.py" && python3 -m unittest discover -s ci/godot/scripts -p "test_*.py" && python3 -m unittest discover -s ci/github -p "test_*.py"'
        language: system
        pass_filenames: false
        files: ^(tools/.*\.(py|js)|assets/placeholder/.*|ci/godot/scripts/.*\.py|ci/github/.*)$

      - id: check-branch-name
        name: branch-name-conforms
        entry: bash ci/godot/scripts/check_branch_name.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-commit-message
        name: commit-message-conforms
        entry: bash ci/godot/scripts/check_commit_message.sh
        language: system
        pass_filenames: true
        stages: [commit-msg]

      - id: run-tests
        name: tests-red-then-green (gdUnit4)
        entry: bash ci/godot/scripts/run_tests.sh
        language: system
        # Only the staged suites run (staged_tests.py); the full suite is CI's (CLAUDE.md).
        pass_filenames: true
        files: ^tests/.*\.gd$
        stages: [pre-commit]
