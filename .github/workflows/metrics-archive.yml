name: metrics-archive

# Spec 43 step 1, Decisions 162 and 164. Started by hand: keeps what the `bench` and
# `sim-checks` logs hold before they expire (90 days; bench run #1's about 2027-01-12),
# under metrics/raw/ (ci/metrics/archive_runs.py). Each run's record from the Actions API
# (the run, its jobs and steps) as <run id>.json, and its log as <run id>.log: the whole
# log for bench, the digest and scaling jobs only for sim-checks. A run already archived on
# main is skipped, so a re-run only adds what's new. The archiver stops before the token's
# hourly limit and says so: run it again an hour later to carry on. A download that fails
# after its retries leaves that run for a later run, and turns this one red.
#
# Delivery (spec 43 step 3): the new files go through the data-PR route
# (.github/actions/metrics-pr): a PR on chore/metrics-archive-<run id> that merges itself
# once the metrics checks pass (Decision 164).

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: metrics-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Archive the runs not yet kept
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 ci/metrics/archive_runs.py metrics/raw | tee -a "$GITHUB_STEP_SUMMARY"
      # Gathered even when the archiver failed part way, so what it kept isn't lost; the run
      # still shows red.
      - name: Gather the new files
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/metrics-new"
          git ls-files -z --others --modified -- metrics/raw \
            | xargs -0 -r cp --parents -t "$RUNNER_TEMP/metrics-new"
      - name: Open the data PR
        if: ${{ !cancelled() }}
        uses: ./.github/actions/metrics-pr
        with:
          folder: ${{ runner.temp }}/metrics-new
          series: archive
          app-id: ${{ vars.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
