name: Sim checks

# The heavy simulation checks, run here rather than in an agent's session: the suite under
# the Rust core, both engines' tick digests compared, the mirror trials fought from both
# sides, and the scaling check. None needs another's output, so after the Rust core is
# built once (`build`) they run side by side: the suite in shards
# (ci/godot/scripts/shard_tests.py), the digests by set and the scaling check by stage. The `summary` job prints a short summary between
# SUMMARY markers, so the outcome can be read from the end of its log.

on:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"
  SHARDS: 4  # keep in step with the suite's matrix below

jobs:
  # Docs, specs, skills and Python-only tools don't change the simulation: the sim checks
  # are skipped for them, which counts as passing (ci/godot/scripts/needs_godot.py).
  scope:
    runs-on: ubuntu-latest
    outputs:
      godot: ${{ steps.scope.outputs.godot }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scope
        run: python3 ci/godot/scripts/needs_godot.py "${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || '' }}"

  # The Rust core, built once and handed to every job below as an artifact.
  build:
    needs: scope
    if: needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.lock', 'native/rust/**/*.rs') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build the Rust core
        run: JOBS=4 bash native/build.sh release 2>&1 | tail -5

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin
          path: native/bin/
          if-no-files-found: error
          retention-days: 1

  # The base's Rust core, built once from the merge base as `bench` builds its base, for the
  # digests jobs' outcome check (Decision 151: outcomes are guarded on Rust).
  base-build:
    needs: scope
    if: needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The PR's base branch; a manual run compares with main.
      BASE_REF: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the merge base
        run: git checkout -q --detach "$(git merge-base "$BASE_REF" HEAD)"

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.lock', 'native/rust/**/*.rs') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build the base's Rust core
        run: JOBS=4 bash native/build.sh release 2>&1 | tail -5

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin-base
          path: native/bin/
          if-no-files-found: error
          retention-days: 1

  suite:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: native-bin
          path: native/bin/

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Suite under the Rust core, shard ${{ matrix.shard }}
        run: |
          BREACH_NATIVE=rust /opt/godot/godot --headless --path . \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            $(python3 ci/godot/scripts/shard_tests.py "$SHARDS" ${{ matrix.shard }}) \
            -c --ignoreHeadlessMode \
            2>&1 | sed 's/\x1b\[[0-9;]*m//g' > suite.${{ matrix.shard }}.log
          # The pipeline's status is sed's: keep gdUnit's, so a failing test fails the job
          # once the log's failures and summary are shown.
          status=${PIPESTATUS[0]}
          grep -E "FAILED|SCRIPT ERROR|Parse Error" suite.${{ matrix.shard }}.log | head -40 || true
          grep -E "^Overall Summary|Statistics" suite.${{ matrix.shard }}.log | tail -1
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-suite-${{ matrix.shard }}
          path: suite.${{ matrix.shard }}.log
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gdunit4-reports-rust-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore

  # One job per digest set: each compares its own two engines' files, so splitting the
  # sets across machines changes nothing (a digest is the same wherever it is taken). Each
  # also takes the base's Rust digest of its set, on the core `base-build` built, and compares
  # the branch's Rust digest with it (check_outcomes.py, Decision 151), so an outcome change
  # both engines share is seen too: it fails unless one of the branch's commits says why
  # (`Outcomes-changed: <why>`).
  digests:
    needs: [build, base-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        set: [standard, clash160, wide]
    env:
      # The PR's base branch; a manual run compares with main.
      BASE_REF: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: native-bin
          path: native/bin/

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Digests ${{ matrix.set }}, both engines
        run: |
          mkdir -p digests
          for engine in gdscript rust; do
            BREACH_NATIVE=$engine /opt/godot/godot --headless --path . \
              --script res://tools/formation_digest.gd -- set=${{ matrix.set }} \
              out=digests/${{ matrix.set }}.$engine.txt > /dev/null 2>&1
          done
          (cd digests && sha256sum *.txt)

      - uses: actions/download-artifact@v7
        with:
          name: native-bin-base
          path: ${{ runner.temp }}/native-bin-base/

      # The base's own Rust digest, from a worktree of the base with its core, against the
      # branch's. Without the core the base would run on GDScript silently, so it must be there.
      - name: Digest ${{ matrix.set }} against the base
        run: |
          git worktree add -q ../base "$(git merge-base "$BASE_REF" HEAD)"
          mkdir -p ../base/native/bin
          cp "$RUNNER_TEMP"/native-bin-base/* ../base/native/bin/
          (cd ../base && /opt/godot/godot --headless --path . --import > /dev/null 2>&1 || true)
          (cd ../base && BREACH_NATIVE=rust /opt/godot/godot --headless --path . \
            --script res://tools/formation_digest.gd -- set=${{ matrix.set }} \
            out="$GITHUB_WORKSPACE/digests/${{ matrix.set }}.base.txt" > /dev/null 2>&1 || true)
          python3 ci/godot/scripts/check_outcomes.py ${{ matrix.set }} \
            digests/${{ matrix.set }}.base.txt digests/${{ matrix.set }}.rust.txt "$BASE_REF" \
            --changed digests/${{ matrix.set }}.changed.txt --engine rust \
            | tee digests/${{ matrix.set }}.outcomes.txt
          exit "${PIPESTATUS[0]}"

      # When outcomes changed: the first 3 changed runs traced on the base and the branch
      # around their first difference, and diffed (specs/37-outcome-trace.md), into traces/.
      - name: Trace ${{ matrix.set }}'s changed runs
        if: always()
        run: |
          if [ -s digests/${{ matrix.set }}.changed.txt ]; then
            bash ci/godot/scripts/trace_changed.sh digests/${{ matrix.set }}.changed.txt \
              ../base digests/traces 3
            head -qn 1 digests/traces/*.diff.txt 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-digests-${{ matrix.set }}
          path: digests/
          retention-days: 7

  trials:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: native-bin
          path: native/bin/

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Mirror trials, both sides
        run: |
          for scenario in mirror_headon mirror_flank; do
            for side in "" swap; do
              /opt/godot/godot --headless --path . --script res://tools/formation_trials.gd -- \
                scenario=$scenario runs=50 $side 2>/dev/null | tail -1 | sed "s/^/${side:-plain} /"
            done
          done | tee trials.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-trials
          path: trials.txt
          retention-days: 7

  # One job per stage (tools/scaling_check.gd): a stage compares only its own sizes, all
  # timed on one machine, so the growth it reports holds; sizes never split across jobs.
  scaling:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [march, fight, stacks]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: native-bin
          path: native/bin/

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Scaling check (Rust), ${{ matrix.stage }}
        run: |
          BREACH_NATIVE=rust /opt/godot/godot --headless --path . \
            --script res://tools/scaling_check.gd -- stages=${{ matrix.stage }} 2>/dev/null \
            | tee scaling.${{ matrix.stage }}.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-scaling-${{ matrix.stage }}
          path: scaling.${{ matrix.stage }}.txt
          retention-days: 7

  # The outcome in one place, as the single job printed it before: fails if either build
  # failed (without the base's, the digests jobs are skipped, not failed) or the two engines'
  # digests differ (each other job fails on its own, the digests
  # also when the branch changes outcomes against its base without saying why). Named as
  # the single job was, so the check keeps its name.
  sim-checks:
    needs: [scope, build, base-build, suite, digests, trials, scaling]
    if: always() && needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: sim-*
          merge-multiple: true

      - name: Summary
        run: |
          {
            echo "SUMMARY BEGIN"
            echo "build: ${{ needs.build.result }}, base's core: ${{ needs.base-build.result }}"
            failed=0
            for log in suite.*.log; do
              [ -e "$log" ] || continue
              failed=$((failed + $(grep -cE ' FAILED' "$log" || true)))
              echo "suite (rust) shard ${log#suite.}: $(grep -E 'Statistics|Overall' "$log" | tail -1)" \
                | sed 's/\.log:/:/'
            done
            echo "suite (rust): $failed failed across $(ls suite.*.log 2>/dev/null | wc -l) of $SHARDS shards"
            for set in standard clash160 wide; do
              g=$(sha256sum $set.gdscript.txt 2>/dev/null | cut -c1-16)
              r=$(sha256sum $set.rust.txt 2>/dev/null | cut -c1-16)
              verdict=$([ -s $set.gdscript.txt ] && [ "$g" = "$r" ] && echo same || echo DIFFERS)
              echo "digest $set: gdscript $g rust $r $verdict"
              head -1 $set.outcomes.txt 2>/dev/null || echo "check_outcomes $set: no result"
            done
            for diff in traces/*.diff.txt; do
              [ -e "$diff" ] && echo "trace $(head -1 "$diff")"
            done
            cat trials.txt 2>/dev/null
            for stage in march fight stacks; do
              grep -E "a side|stacks|FAILED" scaling.$stage.txt 2>/dev/null \
                || echo "scaling $stage: no result"
            done
            echo "SUMMARY END"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.build.result }}" = "success" ]
          [ "${{ needs.base-build.result }}" = "success" ]
          ! grep -q DIFFERS "$GITHUB_STEP_SUMMARY"
