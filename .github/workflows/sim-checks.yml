name: Sim checks

# The heavy simulation checks, run here rather than in an agent's session: the suite under
# the Rust core, the tick digests compared with the base's, the mirror trials fought from both
# sides, the digests and trials required equal on one thread and on the pool, and the scaling
# check. None needs another's output, so after the Rust core is
# built once (`build`) they run side by side: the suite in shards
# (ci/godot/scripts/shard_tests.py), the digests by set and the scaling check by stage. Only
# the suite needs Godot: the digests, trials and scaling check are the crate's own binaries
# (native/bin/breach_*), the GDScript tools they were checked against retired in spec 39
# step 9d-iii. The `summary` job prints a short summary between SUMMARY markers, so the
# outcome can be read from the end of its log.

on:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"
  SHARDS: 4  # keep in step with the suite's matrix below

jobs:
  # Docs, specs, skills and Python-only tools don't change the simulation: the sim checks
  # are skipped for them, which counts as passing (ci/godot/scripts/needs_godot.py).
  scope:
    runs-on: ubuntu-latest
    outputs:
      godot: ${{ steps.scope.outputs.godot }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scope
        run: python3 ci/godot/scripts/needs_godot.py "${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || '' }}"

  # The Rust core, built once and handed to every job below as an artifact.
  build:
    needs: scope
    if: needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.lock', 'native/rust/**/*.rs') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build the Rust core
        run: JOBS=4 bash native/build.sh release 2>&1 | tail -5

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin
          path: native/bin/
          if-no-files-found: error
          retention-days: 1

  # The base's Rust core, built once from the merge base as `bench` builds its base, for the
  # digests jobs' outcome check (Decision 151: outcomes are guarded on Rust).
  base-build:
    needs: scope
    if: needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The PR's base branch; a manual run compares with main.
      BASE_REF: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the merge base
        run: git checkout -q --detach "$(git merge-base "$BASE_REF" HEAD)"

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.lock', 'native/rust/**/*.rs') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build the base's Rust core
        run: JOBS=4 bash native/build.sh release 2>&1 | tail -5

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin-base
          path: native/bin/
          if-no-files-found: error
          retention-days: 1

  suite:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: native-bin
          path: native/bin/

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Suite under the Rust core, shard ${{ matrix.shard }}
        run: |
          /opt/godot/godot --headless --path . \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            $(python3 ci/godot/scripts/shard_tests.py "$SHARDS" ${{ matrix.shard }}) \
            -c --ignoreHeadlessMode \
            2>&1 | sed 's/\x1b\[[0-9;]*m//g' > suite.${{ matrix.shard }}.log
          # The pipeline's status is sed's: keep gdUnit's, so a failing test fails the job
          # once the log's failures and summary are shown.
          status=${PIPESTATUS[0]}
          grep -E "FAILED|SCRIPT ERROR|Parse Error" suite.${{ matrix.shard }}.log | head -40 || true
          grep -E "^Overall Summary|Statistics" suite.${{ matrix.shard }}.log | tail -1
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-suite-${{ matrix.shard }}
          path: suite.${{ matrix.shard }}.log
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gdunit4-reports-rust-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore

  # One job per digest set (a digest is the same wherever it is taken, so splitting the sets
  # across machines changes nothing), played in the crate with nothing from Godot
  # (native/bin/breach_digest). Each takes the base's digest of its set, on the core
  # `base-build` built, and compares the branch's with it (check_outcomes.py, Decision 151):
  # it fails unless one of the branch's commits says why (`Outcomes-changed: <why>`).
  digests:
    needs: [build, base-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        set: [standard, clash160, wide]
    env:
      # The PR's base branch; a manual run compares with main.
      BASE_REF: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: native-bin
          path: native/bin/

      - name: Digest ${{ matrix.set }}
        run: |
          set -o pipefail
          chmod +x native/bin/breach_digest
          mkdir -p digests
          native/bin/breach_digest set=${{ matrix.set }} \
            out=digests/${{ matrix.set }}.branch.txt > digests/${{ matrix.set }}.branch.runs
          (cd digests && sha256sum *.txt)

      # Threads change nothing (spec 39 step 10c): the set again on one thread and on the
      # pool at every size (`threaded=always`, past the threshold that keeps small battles on
      # one thread), each required equal to the default's, to the byte.
      - name: Digest ${{ matrix.set }} on one thread and on the pool
        run: |
          verdict="threads ${{ matrix.set }}: equal on one thread and on the pool"
          for how in false always; do
            native/bin/breach_digest set=${{ matrix.set }} threaded=$how \
              out=digests/${{ matrix.set }}.threads-$how.txt > /dev/null
            if ! cmp -s digests/${{ matrix.set }}.branch.txt digests/${{ matrix.set }}.threads-$how.txt; then
              verdict="threads ${{ matrix.set }}: DIFFER with threaded=$how"
              diff digests/${{ matrix.set }}.branch.txt digests/${{ matrix.set }}.threads-$how.txt | head -4
            fi
          done
          echo "$verdict" | tee digests/${{ matrix.set }}.threads.txt
          ! grep -q DIFFER digests/${{ matrix.set }}.threads.txt

      - uses: actions/download-artifact@v7
        with:
          name: native-bin-base
          path: ${{ runner.temp }}/native-bin-base/

      # The base's own digest, from a worktree of the base with its core, against the
      # branch's. A base from before spec 39 step 8c-xiii has no breach_digest: its digest is
      # empty, and check_outcomes passes the set with a note.
      - name: Digest ${{ matrix.set }} against the base
        run: |
          git worktree add -q ../base "$(git merge-base "$BASE_REF" HEAD)"
          mkdir -p ../base/native/bin
          cp "$RUNNER_TEMP"/native-bin-base/* ../base/native/bin/
          chmod +x ../base/native/bin/breach_* 2>/dev/null || true
          (cd ../base && native/bin/breach_digest set=${{ matrix.set }} \
            out="$GITHUB_WORKSPACE/digests/${{ matrix.set }}.base.txt" > /dev/null 2>&1 || true)
          python3 ci/godot/scripts/check_outcomes.py ${{ matrix.set }} \
            digests/${{ matrix.set }}.base.txt digests/${{ matrix.set }}.branch.txt "$BASE_REF" \
            --changed digests/${{ matrix.set }}.changed.txt \
            | tee digests/${{ matrix.set }}.outcomes.txt
          exit "${PIPESTATUS[0]}"

      # When outcomes changed: the first 3 changed runs traced on the base and the branch
      # around their first difference, and diffed (specs/37-outcome-trace.md), into traces/.
      - name: Trace ${{ matrix.set }}'s changed runs
        if: always()
        run: |
          if [ -s digests/${{ matrix.set }}.changed.txt ]; then
            bash ci/godot/scripts/trace_changed.sh digests/${{ matrix.set }}.changed.txt \
              ../base digests/traces 3
            head -qn 1 digests/traces/*.diff.txt 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-digests-${{ matrix.set }}
          path: digests/
          retention-days: 7

  # The trials fought in the crate (native/bin/breach_trials): the mirrors from both sides,
  # 50 runs each, for the summary; every scenario over 10 runs, the fatigue trials' four
  # contacts and the path and sight trials, kept as artifacts. A trial that can't be fought
  # fails the job.
  trials:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: native-bin
          path: native/bin/

      - name: Trials in the crate
        run: |
          set -eo pipefail
          chmod +x native/bin/breach_trials
          for scenario in mirror_headon mirror_flank; do
            for side in "" swap; do
              native/bin/breach_trials scenario=$scenario runs=50 $side \
                | tail -1 | sed "s/^/${side:-plain} /"
            done
          done | tee trials.txt
          native/bin/breach_trials runs=10 > trials.all.txt
          native/bin/breach_trials scenario=fatigue runs=10 > trials.fatigue.txt
          native/bin/breach_trials scenario=paths repeats=1 > trials.paths.txt

      # Threads change nothing (spec 39 step 10c): every scenario and the fatigue trials again
      # on one thread and on the pool at every size, each required equal to the default's.
      - name: Trials on one thread and on the pool
        run: |
          verdict="threads trials: equal on one thread and on the pool"
          for how in false always; do
            native/bin/breach_trials runs=10 threaded=$how > trials.all.$how.txt
            native/bin/breach_trials scenario=fatigue runs=10 threaded=$how > trials.fatigue.$how.txt
            for kind in all fatigue; do
              if ! cmp -s trials.$kind.txt trials.$kind.$how.txt; then
                verdict="threads trials: DIFFER in $kind with threaded=$how"
                diff trials.$kind.txt trials.$kind.$how.txt | head -4
              fi
            done
          done
          echo "$verdict" | tee trials.threads.txt
          ! grep -q DIFFER trials.threads.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-trials
          path: trials*.txt
          retention-days: 7

  # One job per stage (native/bin/breach_scaling): a stage compares only its own sizes, all
  # timed on one machine, so the growth it reports holds; sizes never split across jobs. Its
  # verdict on its own growth gates it.
  scaling:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [march, fight, stacks]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: native-bin
          path: native/bin/

      - name: Scaling check, ${{ matrix.stage }}
        run: |
          set -o pipefail
          chmod +x native/bin/breach_scaling
          native/bin/breach_scaling stages=${{ matrix.stage }} | tee scaling.${{ matrix.stage }}.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-scaling-${{ matrix.stage }}
          path: scaling.${{ matrix.stage }}.txt
          retention-days: 7

  # The outcome in one place, as the single job printed it before: fails if either build
  # failed (without the base's, the digests jobs are skipped, not failed) or a digest is
  # missing (each other job fails on its own, the digests when the branch changes outcomes
  # against its base without saying why). Named as
  # the single job was, so the check keeps its name.
  sim-checks:
    needs: [scope, build, base-build, suite, digests, trials, scaling]
    if: always() && needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: sim-*
          merge-multiple: true

      - name: Summary
        run: |
          {
            echo "SUMMARY BEGIN"
            echo "build: ${{ needs.build.result }}, base's core: ${{ needs.base-build.result }}"
            failed=0
            for log in suite.*.log; do
              [ -e "$log" ] || continue
              failed=$((failed + $(grep -cE ' FAILED' "$log" || true)))
              echo "suite (rust) shard ${log#suite.}: $(grep -E 'Statistics|Overall' "$log" | tail -1)" \
                | sed 's/\.log:/:/'
            done
            echo "suite (rust): $failed failed across $(ls suite.*.log 2>/dev/null | wc -l) of $SHARDS shards"
            for set in standard clash160 wide; do
              b=$(sha256sum $set.branch.txt 2>/dev/null | cut -c1-16)
              verdict=$([ -s $set.branch.txt ] && echo taken || echo MISSING)
              echo "digest $set: $b $verdict"
              head -1 $set.outcomes.txt 2>/dev/null || echo "check_outcomes $set: no result"
              cat $set.threads.txt 2>/dev/null || echo "threads $set: no result"
            done
            for diff in traces/*.diff.txt; do
              [ -e "$diff" ] && echo "trace $(head -1 "$diff")"
            done
            cat trials.txt 2>/dev/null
            cat trials.threads.txt 2>/dev/null || echo "threads trials: no result"
            for stage in march fight stacks; do
              grep -E "a side|stacks|FAILED" scaling.$stage.txt 2>/dev/null \
                || echo "scaling $stage: no result"
            done
            echo "SUMMARY END"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.build.result }}" = "success" ]
          [ "${{ needs.base-build.result }}" = "success" ]
          ! grep -q MISSING "$GITHUB_STEP_SUMMARY"
          ! grep -q DIFFER "$GITHUB_STEP_SUMMARY"
