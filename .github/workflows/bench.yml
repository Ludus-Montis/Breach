name: Bench

# Long benchmark runs, started by hand (or by an agent through the GitHub API) instead of
# in an agent's session: `tool` with `args` on the branch the run is started on (or on
# `head`, a branch or commit checked out beside it), and - if
# `base` names another branch or commit - the same on it, on the same runner, so the two
# compare like for like. The last step prints both between SUMMARY markers. GitHub's
# runners are slower than a desktop: read the comparison, not the absolute times. A `tool`
# is one of the crate's own binaries, native/bin/breach_<name>, run with nothing from Godot
# (spec 39 step 9d-iii retired the GDScript benches under tools/).
#
# One run each can't tell a 5% change from the swing any change of code brings (an A/A run
# repeats to within 1%, two commits move phases neither touched by 5 to 20%: spec 35
# step 5b). With `rounds` above 1 and a base, the two run in turn - head first in odd rounds,
# base first in even ones, so a drift on the runner falls on both - and the summary is each
# phase's medians, change and ranges (ci/godot/scripts/bench_compare.py), `*` where the
# ranges don't overlap, then round 1's raw output. With 3 rounds, two sides that don't
# differ still fall apart that way for about 1 phase in 10; with 5, about 1 in 125.
#
# `base_args` (spec 39 step 10a) gives the base side its own arguments: with no `base`, the
# two sides are one commit run two ways, in turn on one runner (threads on and off, say, or
# two presets). `scale` then checks that the base's battle can stand in for the head's
# (ci/godot/scripts/bench_scaling.py): `args` "preset=25k", `base_args` "preset=4096" and
# `scale` 6, the ratio of their squads, tell whether the daily 4096 bench tracks the target.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "The crate's binary to run: breach_tick_phases, breach_scaling, breach_rout_bench or breach_native_bench"
        default: "breach_tick_phases"
      args:
        description: "Its arguments"
        default: "side=4096 squads=4 fight=3"
      head:
        description: "Branch or commit to time as the head (empty: the branch the run is on)"
        default: ""
      base:
        description: "Branch or commit to compare against (empty: none)"
        default: ""
      rounds:
        description: "Runs of each, head and base in turn (1 to 20; 5 or more to judge a few %)"
        default: "1"
      base_args:
        description: "The base side's arguments (empty: args); with no base, the head run with these"
        default: ""
      scale:
        description: "The head's expected growth over the base, checked by bench_scaling.py (empty: none)"
        default: ""

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.lock', 'native/rust/**/*.rs') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Check out the head
        if: inputs.head != ''
        env:
          HEAD_REF: ${{ inputs.head }}
        run: git worktree add head "origin/$HEAD_REF" 2>/dev/null || git worktree add head "$HEAD_REF"

      - name: Check out the base
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: git worktree add base "$BASE"

      - name: Run on this branch and the base
        env:
          TOOL: ${{ inputs.tool }}
          ARGS: ${{ inputs.args }}
          BASE: ${{ inputs.base }}
          ROUNDS: ${{ inputs.rounds }}
          HEAD_REF: ${{ inputs.head }}
          BASE_ARGS: ${{ inputs.base_args }}
        run: |
          here=.; if [ -n "$HEAD_REF" ]; then here=head; fi
          there=base; if [ -z "$BASE" ]; then there="$here"; fi
          base_args="${BASE_ARGS:-$ARGS}"
          case "$ROUNDS" in ''|*[!0-9]*) echo "rounds must be a whole number"; exit 1;; esac
          if [ "$ROUNDS" -lt 1 ] || [ "$ROUNDS" -gt 20 ]; then echo "rounds: 1 to 20"; exit 1; fi
          case "$TOOL" in breach_*) ;; *) echo "::error::tool must be a crate binary, breach_<name>"; exit 1;; esac
          prepare() {
            (cd "$1" && JOBS=4 bash native/build.sh release > /dev/null 2>&1)
          }
          time_in() {
            # stderr is kept aside, and shown if the tool failed (#601)
            local err="$RUNNER_TEMP/stderr.txt"
            (cd "$1" && "native/bin/$TOOL" $2 2>"$err") \
              || { echo "::error::$TOOL failed in $1; its stderr:" >&2; tail -n 40 "$err" >&2; return 1; }
          }
          prepare "$here" || true  # time what was built; a missing binary fails time_in
          if [ -n "$BASE" ]; then prepare base || true; fi
          for round in $(seq 1 "$ROUNDS"); do
            if [ -z "$BASE" ] && [ -z "$BASE_ARGS" ]; then
              time_in "$here" "$ARGS" > "head_$round.txt"
            elif [ $((round % 2)) -eq 1 ]; then
              time_in "$here" "$ARGS" > "head_$round.txt"
              time_in "$there" "$base_args" > "base_$round.txt"
            else
              time_in "$there" "$base_args" > "base_$round.txt"
              time_in "$here" "$ARGS" > "head_$round.txt"
            fi
          done

      - name: Summary
        if: always()
        env:
          TOOL: ${{ inputs.tool }}
          ARGS: ${{ inputs.args }}
          BASE: ${{ inputs.base }}
          ROUNDS: ${{ inputs.rounds }}
          HEAD_NAME: ${{ inputs.head || github.ref_name }}
          HEAD_REF: ${{ inputs.head }}
          BASE_ARGS: ${{ inputs.base_args }}
          SCALE: ${{ inputs.scale }}
        run: |
          here=.; if [ -n "$HEAD_REF" ]; then here=head; fi
          there=base; if [ -z "$BASE" ]; then there="$here"; fi
          base_args="${BASE_ARGS:-$ARGS}"
          base_name="${BASE:-$HEAD_NAME}"
          two=""; if [ -n "$BASE" ] || [ -n "$BASE_ARGS" ]; then two=1; fi
          {
            echo "SUMMARY BEGIN"
            echo "== $HEAD_NAME ($(git -C "$here" rev-parse --short HEAD)): $TOOL $ARGS"
            if [ -n "$two" ]; then
              echo "== base $base_name ($(git -C "$there" rev-parse --short HEAD 2>/dev/null)): $TOOL $base_args"
            fi
            if [ -n "$two" ] && [ "$ROUNDS" -gt 1 ] 2>/dev/null; then
              heads=$(ls head_*.txt | sort -V); bases=$(ls base_*.txt | sort -V)
              python3 ci/godot/scripts/bench_compare.py --head $heads --base $bases
            fi
            if [ -n "$two" ] && [ -n "$SCALE" ]; then
              heads=$(ls head_*.txt | sort -V); bases=$(ls base_*.txt | sort -V)
              python3 ci/godot/scripts/bench_scaling.py --factor "$SCALE" --large $heads --small $bases \
                || echo "== the base's battle doesn't stand in for the head's (above)"
            fi
            if [ -n "$two" ] && [ "$ROUNDS" -gt 1 ] 2>/dev/null; then
              echo "== round 1, $HEAD_NAME"
            fi
            cat head_1.txt 2>/dev/null
            if [ -n "$two" ]; then
              echo "== round 1, base $base_name"
              cat base_1.txt 2>/dev/null
            fi
            echo "SUMMARY END"
          } | tee -a "$GITHUB_STEP_SUMMARY"
