name: bench-series

# Spec 43 step 5, Decisions 162 and 164. Started by hand: the backfill of the bench history.
# Each first-parent commit on main that touched sim/ or native/ since 2026-10-14 (or the
# commits given) is timed with its own harness against its era's reference, in turn for 5
# rounds (ci/metrics/bench_series.py): the crate's breach_tick_phases against the bridge,
# 8ca4227, where the commit has it; otherwise tools/tick_phases.gd and tools/formation_bench.gd
# against eee3e81, a record each. The bridge is timed with all three, so the history states
# the factor between the eras. The commits are spread over a matrix of jobs, a few each, and
# each job's records go through the data-PR route (.github/actions/metrics-pr), so the
# backfill lands as several data PRs that merge themselves.
#
# Build cost: the `references` job builds eee3e81 and 8ca4227 once and hands their binaries
# to every timing job, and saves its build folder as one cache entry (a fixed key, written
# once) that the timing jobs restore. In a timing job every commit builds into that one shared
# folder (BENCH_TARGET), so the dependencies are built once and each commit recompiles only
# what changed. Each job first deletes runner tools it doesn't use, for disk.
#
# `set=25k` (spec 43 step 8b, Decision 165): instead, step 8a's 25k set (ci/metrics/series_25k.py)
# on each commit the 4,096 backfill times with the crate's breach_tick_phases (the GDScript era
# is left out), `series=1` on nine shapes, the two 24,576 checks in turn with the bridge, a
# record a shape. A shape a commit's harness can't run writes no record; the page shows a gap.

on:
  workflow_dispatch:
    inputs:
      commits:
        description: "Commits to time, space-separated (empty: every first-parent commit on main touching sim/ or native/ since 2026-10-14)"
        default: ""
      per_job:
        description: "Commits per job"
        default: "3"
      set:
        description: "The set: 4096 (the daily bench's battle, each harness) or 25k (step 8a's set, the Rust era only)"
        type: choice
        options: ["4096", "25k"]
        default: "4096"

permissions:
  contents: read
  pull-requests: read

env:
  GODOT_VERSION: "4.7.2-stable"
  BENCH_TARGET: ${{ github.workspace }}/target-shared
  # One entry, written once by `references`: bump the version to rebuild it.
  TARGET_CACHE: bench-series-target-v1

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The jobs
        id: plan
        env:
          COMMITS: ${{ inputs.commits }}
          PER_JOB: ${{ inputs.per_job }}
          SET: ${{ inputs.set }}
        run: |
          set -o pipefail
          jobs=$(python3 ci/metrics/bench_series.py plan --commits "$COMMITS" --per-job "$PER_JOB" --set "$SET")
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "$jobs" | python3 -c "import json,sys; j=json.load(sys.stdin); print(f'{sum(len(x[\"commits\"].split()) for x in j)} commits in {len(j)} jobs')" >> "$GITHUB_STEP_SUMMARY"

  references:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore the shared build folder
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ${{ env.BENCH_TARGET }}
          key: ${{ env.TARGET_CACHE }}
      - name: Build the references
        env:
          SET: ${{ inputs.set }}
        run: python3 ci/metrics/bench_series.py build --set "$SET"
      - name: Save the shared build folder
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ${{ env.BENCH_TARGET }}
          key: ${{ env.TARGET_CACHE }}
      # tar keeps the binaries' execute bit, which an artifact on its own drops.
      - name: Pack the references' binaries
        run: tar czf references.tgz trees/*/native/bin
      - uses: actions/upload-artifact@v7
        with:
          name: references
          path: references.tgz
          retention-days: 1

  bench:
    needs: [plan, references]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk
        run: |
          before=$(df -h --output=avail / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          echo "Free disk: $before before, $(df -h --output=avail / | tail -1) after." >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/godot
        if: inputs.set != '25k'
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Restore the shared build folder
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ${{ env.BENCH_TARGET }}
          key: ${{ env.TARGET_CACHE }}

      - uses: actions/download-artifact@v7
        with:
          name: references

      - name: Unpack the references
        run: |
          for sha in eee3e81fc92b026f869fdfced2f16a5306884d0b 8ca422726e68909554eddad7eeee2199e0fe656d; do
            git worktree add -q --detach "trees/${sha:0:12}" "$sha"
          done
          tar xzf references.tgz

      - name: Time the commits and write their records
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMITS: ${{ matrix.job.commits }}
          OFFSET: ${{ matrix.job.offset }}
          SET: ${{ inputs.set }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/metrics-new"
          start=$(date +%s)
          python3 ci/metrics/bench_series.py run --commits "$COMMITS" --offset "$OFFSET" \
            --out "$RUNNER_TEMP/metrics-new" --godot /opt/godot/godot --set "$SET" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Took $(( ($(date +%s) - start) / 60 )) min; free disk at the end: $(df -h --output=avail / | tail -1)." >> "$GITHUB_STEP_SUMMARY"

      - name: Open the data PR
        if: ${{ !cancelled() }}
        uses: ./.github/actions/metrics-pr
        with:
          folder: ${{ runner.temp }}/metrics-new
          series: bench-series
          run-id: ${{ github.run_id }}-${{ inputs.set == '25k' && '25k-' || '' }}${{ matrix.job.index }}
          app-id: ${{ vars.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
