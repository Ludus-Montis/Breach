name: metrics

# Spec 43 step 2, Decisions 162 and 163. On any PR that touches metrics/ (or this check's own
# code): every record under metrics/, apart from metrics/raw/, is validated against the
# schema its `schema` field names (ci/metrics/check_records.py), and the PR is reported as
# data-only or not (ci/metrics/data_only.py: every path under metrics/, none under
# metrics/schema/). A data-only PR's sim-checks, docs-gate and rust jobs pass at once; this
# is its real check. The `records` check is required, so the self-merging data PRs (step 3,
# .github/actions/metrics-pr) merge only when it passes.

on:
  pull_request:
    paths:
      - "metrics/**"
      - "ci/metrics/**"
      - ".github/workflows/metrics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install "jsonschema==4.*"

      - name: The check's own tests
        env:
          METRICS_REQUIRE_JSONSCHEMA: "1"
        run: python3 -m unittest discover -s ci/metrics -p "test_*.py"

      - name: Check the records
        run: python3 ci/metrics/check_records.py metrics metrics/schema

      - name: Data-only?
        id: data
        run: python3 ci/metrics/data_only.py "${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || '' }}"

      - name: Report
        run: |
          if [ "${{ steps.data.outputs.data_only }}" = "true" ]; then
            echo "This PR is data-only (Decision 163): every path under metrics/, none under metrics/schema/." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This PR is not data-only: it touches a path outside metrics/, or under metrics/schema/, so the normal checks apply." >> "$GITHUB_STEP_SUMMARY"
          fi
