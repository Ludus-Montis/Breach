name: CI

# The baseline: lint, the static checks and commit messages (`run-baseline`), the gdUnit4
# suite on the GDScript engine split into shards (`tests`, ci/godot/scripts/shard_tests.py)
# and the scaling check by stage (`scaling`), side by side.

on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2-stable"
  SHARDS: 4  # keep in step with the tests' matrix below

jobs:
  # Docs, specs, skills and Python-only tools don't need Godot: they skip the gdUnit4
  # suite and the scaling check (ci/godot/scripts/needs_godot.py decides by the files
  # changed). Pushes to main always run everything.
  scope:
    runs-on: ubuntu-latest
    outputs:
      godot: ${{ steps.scope.outputs.godot }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scope
        run: python3 ci/godot/scripts/needs_godot.py "${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || '' }}"

  run-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: pip install "gdtoolkit==4.*" pre-commit

      - name: Pre-create gdtoolkit's grammar cache directory
        # Works around a confirmed upstream race condition
        # (github.com/Scony/godot-gdscript-toolkit#428): gdtoolkit's parser creates its
        # grammar cache dir with an unguarded `os.makedirs` (no exist_ok), so two
        # gdtoolkit processes starting close together on a cold CI cache can both see
        # it missing and race to create it - the loser gets a FileExistsError that
        # gets misreported as "Cannot open file '<unrelated .gd file>': File exists".
        # Hit this for real on this repo's own CI before adding this step. A developer
        # machine only ever races once (the cache then persists), which is why this is
        # CI-only in practice.
        run: |
          python -c "import os; from importlib.metadata import version; from gdtoolkit.parser.parser import get_cache_directory; os.makedirs(os.path.join(get_cache_directory(), 'gdtoolkit', version('gdtoolkit')), exist_ok=True)"

      - name: Run baseline checks (gdlint, gdformat, custom scripts)
        env:
          # Decision 50: diff-scoped checks compare a change with its own base: a PR with
          # its base branch (a stacked PR's is the PR below it), a push with the commit
          # before it. A push checks out the branch itself, so detecting its base would
          # pick whichever other branch is nearest and count changes the push didn't make.
          BASE_REF: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          SKIP: run-tests  # the suite runs in the `tests` job's shards
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check commit messages (commit-message-conforms)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          # --no-merges: exclude GitHub's synthetic pull_request "merge preview" commit
          # (auto-generated subject, not one of the PR's real authored commits) -
          # verified as the cause of a real false-positive failure on this PR's first
          # CI run before this flag was added.
          for sha in $(git rev-list --no-merges "origin/${{ github.event.pull_request.base.ref }}..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            echo "Checking $sha:"
            bash ci/godot/scripts/check_commit_message.sh /tmp/commit-msg.txt
          done

  # The Rust core, built once for the jobs that start Godot: every run loads the content
  # through it (CrateContent, Decision 153), whichever engine runs the kernels.
  native:
    needs: scope
    if: needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.lock', 'native/rust/**/*.rs') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build the Rust core
        run: JOBS=4 bash native/build.sh release 2>&1 | tail -5

      - uses: actions/upload-artifact@v7
        with:
          name: native-bin-ci
          path: native/bin/
          if-no-files-found: error
          retention-days: 1

  tests:
    needs: [scope, native]
    if: needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: native-bin-ci
          path: native/bin/

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Tests (gdUnit4), shard ${{ matrix.shard }}
        run: |
          /opt/godot/godot --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            $(python3 ci/godot/scripts/shard_tests.py "$SHARDS" ${{ matrix.shard }}) \
            -c --ignoreHeadlessMode

      - name: Upload gdUnit4 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdunit4-reports-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore

  # One job per stage (tools/scaling_check.gd): a stage compares only its own sizes, all
  # timed on one machine, so the growth it reports holds; sizes never split across jobs.
  scaling:
    needs: [scope, native]
    if: needs.scope.outputs.godot == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [march, fight, stacks]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: native-bin-ci
          path: native/bin/

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Scaling check (bounded-scaling, principles/bounded-work.md), ${{ matrix.stage }}
        run: |
          /opt/godot/godot --headless --path . --script res://tools/scaling_check.gd -- \
            stages=${{ matrix.stage }}
