name: github-sync

# Specs 36 and 40, Decisions 148 and 155. Cloud agents can't create labels or milestones,
# so this does (ci/github/sync.py). On a push to main that changes specs/ or the sync: the fixed
# labels, a milestone per specs/NN-*.md, a step:NN-<id> label per `### Step <id>`
# heading, and a parent issue per spec with a sub-issue per step; a step issue whose
# heading is gone is closed as not planned. On a PR that changes a spec: the labels, and
# the spec's milestone on the PR and on each issue it closes. It creates only what is
# missing, so a second run changes nothing: before creating for a spec it reads the
# spec's milestone too, and it keeps one issue per sync marker, the lowest-numbered,
# closing any later copy as a duplicate, and moves each kept step under its spec's kept
# parent (spec 40 step 4). Each run first prints how many
# issues, PRs and markers it read. Then each spec's parent and milestone follow their
# items (spec 40 step 5, ci/github/open_while_open.py): a parent with steps is open while
# any step is, a `Spec NN: <title>` milestone while any issue or PR in it is. When an
# issue is closed or reopened, only that rule runs, for its parent (if it is a sync step)
# and its milestone; nothing is created. By hand, it does what a push does; with
# `migrate`, it then moves OPEN_QUESTIONS.md's open entries to issues labelled `question`
# (ci/github/migrate_questions.py); an entry already moved is skipped.

on:
  push:
    branches: [main]
    # The sync's own files too, so a change to it (spec 40 step 1's merge) runs it.
    paths: ["specs/**", "ci/github/**", ".github/workflows/github-sync.yml"]
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths: ["specs/**"]
  # The sync's own closes start no workflow (GITHUB_TOKEN), so its run applies the rule too.
  issues:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      migrate:
        description: "Also move OPEN_QUESTIONS.md's open entries to issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: github-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Labels, milestones and step issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/github/sync.py
      - name: Migrate the open questions
        if: ${{ inputs.migrate }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/github/migrate_questions.py
