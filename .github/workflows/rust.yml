name: Rust

# The Rust crate's own checks (spec 39 step 1, Decision 154): formatting, clippy with
# warnings as errors, and its cargo tests. None starts Godot. Runs on every PR that touches
# native/, the content the crate loads and the schema it checks in (spec 39 step 2), or the
# designer's saved maps, exports and page its tests read (step 2c; the designer's server is the
# crate's). A data-only PR (Decision 163) passes at once: none of these paths is under
# metrics/, so it shouldn't start, but if it does, its first step ends the job.

on:
  pull_request:
    paths:
      - "native/**"
      - "content/units/**"
      - "content/weapons/**"
      - "content/armour/**"
      - "content/tuning/**"
      - "content/terrain/**"
      - "content/maps/**"
      - "content/maps_src/**"
      - "content/schema/**"
      - "tests/fixtures/designer/**"
      - "tests/fixtures/structure/**"
      - "tools/designer/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Data-only?
        id: data
        working-directory: .
        run: python3 ci/metrics/data_only.py "${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}"

      - name: Cache Rust build
        if: steps.data.outputs.data_only != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: rust-check-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.lock', 'native/rust/**/*.rs') }}
          restore-keys: rust-check-${{ runner.os }}-

      - name: Format
        if: steps.data.outputs.data_only != 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.data.outputs.data_only != 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: steps.data.outputs.data_only != 'true'
        run: cargo test
