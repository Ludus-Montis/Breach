[package]
name = "breach_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# rlib too, for the designer's binary (src/bin/designer.rs).
crate-type = ["cdylib", "rlib"]

[dependencies]
# api-4-7: bindings generated from Godot 4.7's extension API, bundled with the crate.
godot = { version = "=0.5.5", features = ["api-4-7"] }
rayon = "1.10"
# The crate's state written and read whole (spec 39 step 1): serde, in bincode's compact
# binary, which keeps every f64 bit for bit (infinities included, which JSON can't hold).
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
# preserve_order: the designer's export is read in its own order (a plan's keyed cells).
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
serde_path_to_error = "0.1.20"
schemars = "1.2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# For iterating (native/build.sh dev): optimised, but no LTO, so a rebuild takes seconds.
# Results are the same bit for bit: Rust never contracts to FMA nor reorders float maths.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
